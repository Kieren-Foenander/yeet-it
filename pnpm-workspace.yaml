packages:
  - infra
allowBuilds:
  esbuild: true
  workerd: true
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - foldkit@0.170.0
  - '@cloudflare/workers-types@5.20261030.1'
  - '@foldkit/vite-plugin@0.29.0'
# Alchemy 2.0.0-beta.84 runs on effect 4.0.x. Keep its transitive Effect packages on
# the same line so the deployment toolchain never loads effect 4.1 internals.
overrides:
  '@alchemy.run/cloudflare>@effect/sql-d1': 4.0.7
  '@effect/platform-node@4.0.7>@effect/platform-node-shared': 4.0.7
