name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://yeet-it.kfoenander98.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: ./.github/actions/setup
      - name: Deploy with Alchemy
        if: steps.credentials.outputs.ready == 'true'
        working-directory: infra
        run: pnpm exec alchemy deploy --stage prod --yes
      - name: Check the live site
        if: steps.credentials.outputs.ready == 'true'
        run: |
          today=$(date -u +%F)
          curl --fail --silent --show-error --retry 5 --retry-delay 5 -o /dev/null "$SITE_URL/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$SITE_URL/api/puzzle/$today" | grep -q "\"date\":\"$today\""
